<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تواصل معنا | خيرات زمان</title>
<script>(function(){try{var t=localStorage.getItem('kz_theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<header id="site-header"></header>
<div class="page-head"><div class="container"><h1>تواصل معنا</h1></div></div>

<main class="section">
  <div class="container narrow">
    <div class="card">
      <p>يسعدنا تواصلك في أي وقت، أرسل لنا رسالة من النموذج وسنرد عليك قريبًا.</p>
      <p>للشكاوى والاستفسارات تواصل معنا عبر واتساب: <a href="https://wa.me/966558815131" target="_blank" rel="noopener"><bdi dir="ltr">+966558815131</bdi></a></p>
      <form id="contact-form" novalidate>
        <div class="field"><label for="name">الاسم</label><input id="name" name="name" required></div>
        <div class="field"><label for="phone">رقم التليفون <span class="opt">(اختياري)</span></label><input id="phone" name="phone" type="tel" dir="ltr"></div>
        <div class="field"><label for="email">البريد الإلكتروني <span class="opt">(اختياري)</span></label><input id="email" name="email" type="email" dir="ltr"></div>
        <div class="field"><label for="message">رسالتك</label><textarea id="message" name="message" required></textarea></div>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div id="contact-msg"></div>
        <button class="btn btn-green" type="submit">إرسال</button>
      </form>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
